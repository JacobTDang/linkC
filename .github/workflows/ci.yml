name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The toolchain the app is developed with (Xcode 26.6, Swift 6.3), on the runner image that ships it.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    name: Build (debug with tests, release)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the toolchain and build cache
        uses: ./.github/actions/swift-toolchain
        with:
          cache-name: build

      # The debug build with tests is a clean compile of everything the tests use: it is where
      # deprecation warnings and Swift 6 strict-concurrency errors show up.
      - name: Build debug, with tests
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Build release
        run: swift build -c release -Xswiftc -warnings-as-errors

  test:
    name: Unit & Integration Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the toolchain and build cache
        uses: ./.github/actions/swift-toolchain
        with:
          cache-name: test

      - name: Run the test suite
        run: swift test --parallel

  thread-sanitizer:
    name: Thread Sanitizer
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the toolchain and build cache
        uses: ./.github/actions/swift-toolchain
        with:
          cache-name: tsan

      - name: Run the test suite under ThreadSanitizer
        run: ./scripts/tsan.sh

  package-app:
    name: Package App Bundle & Signing
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the toolchain and build cache
        uses: ./.github/actions/swift-toolchain
        with:
          cache-name: package

      - name: Build and sign the .app bundle
        run: ./build-app.sh

      - name: Verify the bundle's signature, binaries and Info.plist
        run: |
          codesign --verify --deep --strict dist.noindex/linkC.app
          test -x dist.noindex/linkC.app/Contents/MacOS/linkC
          test -x dist.noindex/linkC.app/Contents/MacOS/linkc-mcp
          plutil -lint dist.noindex/linkC.app/Contents/Info.plist
          echo "App bundle signature, binaries and Info.plist verified."

  policy:
    name: Commit Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the commit check
        run: ./scripts/test-check-commits.sh

      - name: Check the commits in this change
        run: |
          # A branch's first push has no "before" commit; check just the pushed head.
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="$HEAD_SHA~1"; fi
          ./scripts/check-commits.sh "$BASE_SHA..$HEAD_SHA"
